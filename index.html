<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14213d" />
    <meta
      name="description"
      content="ProdNote: локальный органайзер задач, заметок, тайм-трекинга и помодоро."
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>ProdNote</title>
  </head>
  <body>
    <app-root></app-root>
    <script>
      if (window.location.protocol === "http:" && window.location.hostname === "127.0.0.1" && window.location.port === "8787") {
        window.location.replace(
          "http://localhost:" +
            window.location.port +
            window.location.pathname +
            window.location.search +
            window.location.hash,
        );
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
